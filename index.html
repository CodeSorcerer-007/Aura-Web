    <script type="application/ld+json">

      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Aura",
      "applicationCategory": "ProductivityApplication",

        "Visual Day & Time Blocking (Morning, Afternoon, Evening)",

        "Living Botanical Sanctuary Gamification (The Grove)",
        "Cosmic Constellations Orbital Task Physics Visualizer",
        "Full 53-Week Productivity Heatmap & GitHub-style Analytics",
        "Air-Gapped Absolute Zero-Network Privacy Architecture",
        "18 Handcrafted Themes with Per-Theme Particle & Ambient Backgrounds"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "A mindful offline productivity companion featuring visual time blocking, ambient soundscapes, personal grove, and flow management."

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
